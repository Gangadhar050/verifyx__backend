spring.application.name=verify-x
server.port=${SERVER_PORT:8080}

# Default IntelliJ/local database: file-based H2, requiring no MySQL setup.
# Data is stored in ./data/verifyx-local-db and remains available after restart.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/verifyx-local-db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.jwt.secret=${JWT_SECRET:MySuperSecretKeyForOfferVerificationProject2026!!}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Vite runs at 5173. Port 3000 is also retained for compatibility.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000}
app.frontend.url=${FRONTEND_URL:http://localhost:5173}
app.name=VerifyX

# Email is optional for local execution. Supply environment variables when required.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.from=${MAIL_FROM:no-reply@verifyx.local}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS_REQUIRED:false}

server.error.include-message=always
